{# Серверные сообщения показываются всплывающими уведомлениями (static/js/ui_toast.js). #}
{% if messages %}
    {% for message in messages %}
        <div class="js-flash" data-level="{{ message.level_tag }}" hidden>{{ message }}</div>
    {% endfor %}
    <noscript>
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">{{ message|linebreaksbr }}</div>
        {% endfor %}
    </noscript>
{% endif %}
