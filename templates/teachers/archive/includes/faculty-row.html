<tr id="faculty-row-{{ faculty.id }}">
    <td class="text-center">{{ forloop.counter }}</td>
    <td>{{ faculty.title }}</td>
    <td>{{ faculty.short_name }}</td>
    <td>
        <button type="button"
                class="btn archive-acts__icon-btn archive-acts__icon-btn--edit js-edit-faculty"
                data-url="{% url 'archive:custom-faculty-edit' faculty.id %}"
                title="Редактировать"
                aria-label="Редактировать">
            <i class="fas fa-edit" aria-hidden="true"></i>
        </button>
    </td>
</tr>
